<style>
    /* ══════════ TOCADISCOS · BASE ══════════ */
    .tt2-deck { position:relative; width:min(440px,100%); aspect-ratio:480/330; margin:0 auto; flex:0 0 auto; }
    .tt2-svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }

    .tt2-platter { position:absolute; left:8%; top:14%; width:52%; aspect-ratio:1; border-radius:50%;
        background:radial-gradient(circle,#2a2a2a 0 55%,#121212 100%);
        border:5px solid #b9b9b9; box-shadow:0 10px 25px rgba(0,0,0,.8), inset 0 0 0 2px #222, inset 0 0 30px rgba(0,0,0,.6); }
    .tt2-platter::after { content:""; position:absolute; left:50%; top:50%; width:10px; height:10px; border-radius:50%;
        transform:translate(-50%,-50%); background:radial-gradient(circle at 35% 35%,#fff,#777); z-index:3; }

    .tt2-disco { position:absolute; inset:4%; border-radius:50%; opacity:0; transform:translateY(-90px) scale(.92);
        transition:transform .9s cubic-bezier(.3,1.3,.5,1), opacity .4s; }
    .tt.open .tt2-disco { opacity:1; transform:none; }

    .tt2-surco { position:absolute; inset:0; border-radius:50%; animation:gira 2.4s linear infinite; animation-play-state:paused;
        background:
            radial-gradient(circle,var(--a) 0 22%,#000 23% 25%,transparent 26%),
            conic-gradient(from 20deg,rgba(255,255,255,.12),transparent 14%,transparent 50%,rgba(255,255,255,.1) 60%,transparent 72%),
            repeating-radial-gradient(circle,#151515 0 2px,#252525 3px 4px);
        box-shadow:0 0 0 2px #050505, 0 12px 30px rgba(0,0,0,.7); }
    .tt2-surco::after { content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
        background:conic-gradient(from 200deg, transparent 0 20%, rgba(255,255,255,.18) 28%, transparent 36%,
                   transparent 60%, rgba(255,255,255,.12) 68%, transparent 76%);
        mix-blend-mode:screen; }
    .tt.playing .tt2-surco { animation-play-state:running; }
    .tt.rpm45 .tt2-surco { animation-duration:1.5s; }

    .tt2-arm { position:absolute; right:15%; top:24%; width:40%; height:7px; border-radius:4px; z-index:4;
        background:linear-gradient(#f4f4f4,#8c8c8c); box-shadow:0 4px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7);
        transform-origin:100% 50%; transform:rotate(20deg); transition:transform .9s ease; }
    .tt2-arm::after { content:""; position:absolute; left:-14px; top:-4px; width:20px; height:14px; background:#1d1d1d;
        border:1px solid #000; border-radius:3px; }
    .tt.playing .tt2-arm { transform:rotate(-4deg); }

    .tt2-pivote { position:absolute; right:calc(15% - 13px); top:calc(24% - 9.5px); width:26px; height:26px; border-radius:50%; z-index:5;
        background:radial-gradient(circle at 35% 35%,#fff,#9a9a9a 55%,#333); box-shadow:0 2px 4px rgba(0,0,0,.5); }

    .tt-etiq { box-shadow:inset 0 0 0 2px rgba(255,255,255,.15), 0 0 0 2px rgba(0,0,0,.6); }

    /* Ecualizador */
    .tt-eq { display:flex; align-items:flex-end; justify-content:center; gap:6px; height:40px; margin-top:14px; flex:0 0 auto; }
    .tt-eq span { width:10px; height:40px; border-radius:4px 4px 0 0; transform-origin:bottom;
        background:linear-gradient(var(--a,#FFB347),var(--c,#B8431A)); box-shadow:0 0 10px var(--a,#FFB347);
        transform:scaleY(.15); animation:eq 1s ease-in-out infinite alternate; animation-play-state:paused; }
    .tt-eq span:nth-child(1)  { animation-duration:.7s; }
    .tt-eq span:nth-child(2)  { animation-duration:.9s; }
    .tt-eq span:nth-child(3)  { animation-duration:.6s; }
    .tt-eq span:nth-child(4)  { animation-duration:1.1s; }
    .tt-eq span:nth-child(5)  { animation-duration:.8s; }
    .tt-eq span:nth-child(6)  { animation-duration:.65s; }
    .tt-eq span:nth-child(7)  { animation-duration:1s; }
    .tt-eq span:nth-child(8)  { animation-duration:.75s; }
    .tt-eq span:nth-child(9)  { animation-duration:.95s; }
    .tt-eq span:nth-child(10) { animation-duration:.62s; }
    .tt.playing .tt-eq span { animation-play-state:running; }
    @keyframes eq { from { transform:scaleY(.15); } to { transform:scaleY(1); } }

    .tt-controles { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; }

    /* ══════════ PANTALLA COMPLETA · DOS COLUMNAS ══════════ */
    .tt.open { padding:0; background:radial-gradient(ellipse at 50% 40%, rgba(40,22,12,.97), rgba(6,3,1,.98) 75%);
        backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }

    .tt.open .tt-box { width:100vw; height:100vh; height:100dvh; max-width:none; max-height:none;
        background:transparent; border:0; border-radius:0; box-shadow:none;
        padding:clamp(12px,2.5vh,28px) clamp(16px,3vw,48px); overflow-y:auto;
        display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto 1fr;
        column-gap:clamp(24px,5vw,80px); row-gap:clamp(8px,1.5vh,16px);
        align-items:center; justify-items:center;
        animation:entra .5s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes entra {
        from { opacity:0; transform:scale(.96) translateY(10px); }
        to   { opacity:1; transform:none; }
    }

    .tt.open .tt-box h2 { grid-column:1 / -1; margin:0; text-align:center; font-family:'Bevan',serif; font-weight:400;
        letter-spacing:.02em; font-size:clamp(1.3rem,3vh,2.4rem); color:#FFB347;
        text-shadow:0 0 18px color-mix(in srgb, var(--a,#FFB347) 70%, transparent), 3px 3px 0 #000; }

    /* Columna izquierda: tornamesa + ecualizador */
    .tt-izq { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; }
    .tt.open .tt2-deck { width:clamp(260px, min(40vw, (100dvh - 230px) * 1.4545), 680px); }
    .tt.open .tt-eq { height:34px; margin-top:16px; }

    /* Columna derecha: Spotify, botones y vinilos */
    .tt-der { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(8px,1.6vh,16px);
        width:100%; max-width:560px; }
    .tt.open #ttSpot { width:100%; }
    .tt.open #ttSpot iframe { height:152px; margin-top:0; }
    .tt.open .tt-controles { gap:10px; }
    .tt.open .btn { font-size:1.05rem; padding:.55rem 1.1rem; margin:0; }

    /* En escritorio el selector siempre está visible en cuadrícula, así que el botón "Elegir" no hace falta */
    .tt.open .tt-picker { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px;
        width:100%; padding:6px 4px; margin:0; }
    .tt.open #ttElegir { display:none; }
    .tt.open .pick { flex:none; width:auto; }

    .tt.open.playing .tt-box { animation:entra .5s cubic-bezier(.2,.9,.3,1.2), pulso 2.4s ease-in-out .5s infinite; }
    @keyframes pulso {
        0%, 100% { filter:drop-shadow(0 0 40px var(--a,#FFB347)); }
        50%      { filter:drop-shadow(0 0 80px var(--a,#FFB347)); }
    }

    /* ══════════ CELULAR · UNA COLUMNA ══════════ */
    @media (max-width:899px) {
        .tt.open .tt-box { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
        .tt.open .tt2-deck { width:clamp(240px, min(88vw, (100dvh - 300px) * 1.4545), 560px); }
        .tt-der { max-width:100%; }
        .tt.open #ttElegir { display:inline-block; }
        .tt.open .tt-picker { display:none; }
        .tt.open .tt-picker.show { display:flex; overflow-x:auto; grid-template-columns:none; }
        .tt.open .pick { flex:0 0 84px; }
        .tt.open .btn { font-size:.95rem; padding:.5rem .8rem; }
    }

    /* Pantallas bajas */
    @media (max-height:700px) and (min-width:900px) {
        .tt.open #ttSpot iframe { height:80px; }
        .tt.open .disco-mini { width:70px; height:70px; }
    }

    /* ══════════ BOTONES Y SELECTOR ══════════ */
    .tt .btn { font-family:inherit; font-weight:700; color:var(--clr-ink); border:3px solid var(--clr-ink); border-radius:6px;
        background:linear-gradient(#FFD27A,#FFB347 55%,#E8962E);
        box-shadow:0 4px 0 #0E0805, 0 8px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
        padding:.45rem .9rem; cursor:pointer; transition:transform .12s, box-shadow .12s, filter .2s; }
    .tt .btn:hover { filter:brightness(1.08); transform:translateY(-2px); }
    .tt .btn:active { transform:translateY(3px);
        box-shadow:0 1px 0 #0E0805, 0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4); }

    .tt-picker { display:none; }
    .tt-picker.show { display:flex; }
    .pick { flex:0 0 92px; cursor:pointer; font-family:'Special Elite',monospace; font-size:.7rem; text-align:center;
        color:#F1E4C8; transition:transform .25s; }
    .pick:hover { transform:translateY(-6px); }
    .disco-mini { position:relative; width:84px; height:84px; margin:0 auto 6px; border-radius:50%; border:2px solid #000;
        background:repeating-radial-gradient(circle,#161616 0 2px,#262626 3px 4px); box-shadow:0 6px 14px rgba(0,0,0,.6);
        transition:transform .4s; }
    .pick:hover .disco-mini { transform:rotate(45deg); }
    .pick.act .disco-mini { box-shadow:0 0 0 3px #FFB347, 0 0 22px #FFB347; }
    .disco-mini .etiq { position:absolute; left:50%; top:50%; width:40%; height:40%; transform:translate(-50%,-50%); border-radius:50%;
        border:2px solid #000; background:linear-gradient(160deg,var(--a),var(--c)); background-size:cover; background-position:center; }

    @media (prefers-reduced-motion: reduce) {
        .tt2-surco, .tt-eq span, .tt.open .tt-box, .tt.open.playing .tt-box { animation:none; }
    }
</style>

<div class="tt" id="tt" role="dialog" aria-modal="true" aria-labelledby="ttTitulo">
    <div class="tt-box">
        <h2 id="ttTitulo"></h2>

        <div class="tt-izq">
            <div class="tt2-deck">
                <svg class="tt2-svg" viewBox="0 0 480 330" aria-hidden="true">
                    <defs>
                        <linearGradient id="tt2Madera" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#A8703D"/>
                            <stop offset=".55" stop-color="#6B3C1C"/>
                            <stop offset="1" stop-color="#4A2510"/>
                        </linearGradient>
                        <linearGradient id="tt2Acrilico" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
                            <stop offset=".5" stop-color="#cfe8ff" stop-opacity=".12"/>
                            <stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
                        </linearGradient>
                    </defs>

                    <rect x="30" y="4" width="420" height="110" rx="12" fill="url(#tt2Acrilico)" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
                    <rect x="210" y="96" width="60" height="10" rx="4" fill="#9a9a9a"/>

                    <rect x="10" y="70" width="460" height="250" rx="16" fill="url(#tt2Madera)" stroke="#2a1206" stroke-width="3"/>
                    <path d="M30 110 Q240 96 450 112 M30 150 Q240 136 450 152 M30 280 Q240 266 450 282"
                          fill="none" stroke="rgba(0,0,0,.14)" stroke-width="2"/>

                    <circle cx="40" cy="322" r="8" fill="#111"/>
                    <circle cx="440" cy="322" r="8" fill="#111"/>

                    <circle cx="150" cy="160" r="120" fill="#0c0704"/>

                    <circle cx="34" cy="296" r="4.5" fill="#ff4a2a"/>
                    <text x="446" y="300" text-anchor="end" font-family="Bevan, serif" font-size="13" fill="#E8C9A0" letter-spacing="1">GIO'S · 33⅓</text>
                </svg>

                <div class="tt2-platter">
                    <div class="tt2-disco">
                        <div class="tt2-surco" id="ttSurco"><div class="tt-etiq" id="ttEtiq"></div></div>
                    </div>
                </div>

                <span class="tt2-pivote"></span>
                <div class="tt2-arm"></div>
            </div>

            <div class="tt-eq" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <div class="tt-der">
            <div id="ttSpot"></div>

            <div class="tt-controles">
                <button type="button" class="btn" id="ttPrev" aria-label="Vinilo anterior">◀</button>
                <button type="button" class="btn" id="ttGirar">⏵ Girar</button>
                <button type="button" class="btn" id="ttNext" aria-label="Vinilo siguiente">▶</button>
            </div>
            <div class="tt-controles">
                <button type="button" class="btn" id="ttElegir">💿 Elegir vinilo</button>
                <button type="button" class="btn" id="ttVel">33⅓ RPM</button>
                <button type="button" class="btn" id="ttNormal">Vista normal</button>
            </div>

            <div class="tt-picker" id="ttPicker"></div>
        </div>
    </div>
</div>

<script>
(function () {
    var tt = document.getElementById('tt');
    var picker = document.getElementById('ttPicker');
    var girar = document.getElementById('ttGirar');
    var vel = document.getElementById('ttVel');

    function vecino(d) {
        var picks = [].slice.call(picker.querySelectorAll('.pick'));
        if (!picks.length) return;
        var i = picks.findIndex(function (p) { return p.classList.contains('act'); });
        if (i < 0) i = 0;
        picks[(i + d + picks.length) % picks.length].click();
    }

    document.getElementById('ttPrev').addEventListener('click', function () { vecino(-1); });
    document.getElementById('ttNext').addEventListener('click', function () { vecino(1); });

    vel.addEventListener('click', function () {
        var on = tt.classList.toggle('rpm45');
        vel.textContent = on ? '45 RPM' : '33⅓ RPM';
    });

    document.addEventListener('keydown', function (e) {
        if (!tt.classList.contains('open')) return;
        if (e.key === ' ') { e.preventDefault(); girar.click(); }
        else if (e.key === 'ArrowRight') { vecino(1); }
        else if (e.key === 'ArrowLeft') { vecino(-1); }
    });
})();
</script>
